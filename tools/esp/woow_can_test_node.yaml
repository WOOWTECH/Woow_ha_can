# WOOW CAN test node: an ESP32 with a CAN transceiver that plays the simulator's test equipment on a real bus.
#
# It answers and sends the same frames as tools/sim/can_sim.py, so tools/analysis_check.py and
# tools/active_check.py can run against real hardware (pass the real interface instead of VCAN0):
#   - body controller 0x3C0 every 100 ms: byte 0 bit 2 door, bit 5 light, byte 1 counter, bytes 2-3 21.5 degC,
#     byte 4 light level; 6F0#xx sets door (bit 0) and light (bit 1); the BOOT button also opens the door
#   - battery 0x356 once a second (voltage 0.01 V little endian, wandering a little)
#   - OBD-II: 7DF 02 01 <PID> -> 7E8 for 05, 0C, 0D (engine speed set from Home Assistant), others unanswered
#   - CANopen node 7 (CiA 401): boot-up and heartbeat 0x707, NMT start / stop, inputs on TPDO1 0x187 while
#     operational (DI0 = BOOT button, DI8-15 = outputs), outputs on RPDO1 0x207 (DO0 drives the board's LED)
# Door, light and engine speed are entities in Home Assistant (ESPHome integration), so a check script can
# "press" them and the analysis tools can be tried with a real bus and a real button.
#
# Wiring: ESP32 TX pin -> transceiver TXD, RX pin -> RXD (SN65HVD230 or TJA1051T/3 at 3.3 V); CANH / CANL to
# the Pi's CAN HAT; 120 ohm at both ends of the bus; common ground. Set the same bit rate on the Pi's interface.
# Copy secrets.example.yaml to secrets.yaml, fill it in, then: esphome run woow_can_test_node.yaml

substitutions:
  name: woow-can-test-node
  board: esp32dev # ESP32-C3 SuperMini: esp32-c3-devkitm-1, led GPIO8, button GPIO9
  tx_pin: GPIO5
  rx_pin: GPIO4
  led_pin: GPIO2
  button_pin: GPIO0
  bit_rate: 500kbps

esphome:
  name: ${name}
  friendly_name: WOOW CAN test node
  on_boot:
    priority: -100
    then:
      - canbus.send: # CANopen boot-up of node 7
          can_id: 0x707
          data: [0x00]

esp32:
  board: ${board}
  framework:
    type: esp-idf

logger:
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

globals:
  - id: door
    type: bool
    initial_value: "false"
  - id: light
    type: bool
    initial_value: "false"
  - id: body_counter
    type: uint8_t
    initial_value: "0"
  - id: io_operational
    type: bool
    initial_value: "false"
  - id: io_do
    type: uint16_t
    initial_value: "0"

output:
  - platform: gpio
    id: led_out
    pin: ${led_pin}

binary_sensor:
  - platform: gpio
    id: boot_button
    name: Button
    pin:
      number: ${button_pin}
      inverted: true
      mode: INPUT_PULLUP

switch:
  - platform: template
    id: door_switch
    name: Door
    lambda: return id(door);
    turn_on_action:
      - globals.set:
          id: door
          value: "true"
    turn_off_action:
      - globals.set:
          id: door
          value: "false"
  - platform: template
    id: light_switch
    name: Light
    lambda: return id(light);
    turn_on_action:
      - globals.set:
          id: light
          value: "true"
    turn_off_action:
      - globals.set:
          id: light
          value: "false"

number:
  - platform: template
    id: engine_speed
    name: Engine speed
    unit_of_measurement: rpm
    min_value: 0
    max_value: 8000
    step: 1
    initial_value: 1726
    optimistic: true

canbus:
  - platform: esp32_can
    id: can_bus
    tx_pin: ${tx_pin}
    rx_pin: ${rx_pin}
    can_id: 0x7E8
    bit_rate: ${bit_rate}
    on_frame:
      - can_id: 0x6F0 # "press" the door / light over the bus, as with the simulator
        then:
          - lambda: |-
              if (x.size() > 0) {
                id(door) = x[0] & 0x01;
                id(light) = x[0] & 0x02;
              }
      - can_id: 0x7DF # OBD-II Service 01
        then:
          - if:
              condition:
                lambda: "return x.size() >= 3 && x[0] == 0x02 && x[1] == 0x01 && (x[2] == 0x05 || x[2] == 0x0C || x[2] == 0x0D);"
              then:
                - canbus.send:
                    can_id: 0x7E8
                    data: !lambda |-
                      uint16_t rpm = (uint16_t) (id(engine_speed).state * 4);
                      switch (x[2]) {
                        case 0x0C: return {0x04, 0x41, 0x0C, (uint8_t) (rpm >> 8), (uint8_t) (rpm & 0xFF), 0xCC, 0xCC, 0xCC};
                        case 0x0D: return {0x03, 0x41, 0x0D, 0x32, 0xCC, 0xCC, 0xCC, 0xCC};
                        default: return {0x03, 0x41, 0x05, 0x7B, 0xCC, 0xCC, 0xCC, 0xCC};
                      }
      - can_id: 0x000 # NMT, for node 7 or all nodes
        then:
          - lambda: |-
              if (x.size() >= 2 && (x[1] == 0x00 || x[1] == 0x07)) {
                if (x[0] == 0x01) id(io_operational) = true;
                else if (x[0] == 0x02 || x[0] == 0x80) id(io_operational) = false;
              }
      - can_id: 0x207 # RPDO1: outputs of node 7
        then:
          - lambda: |-
              if (x.size() > 0) {
                id(io_do) = x[0] | (x.size() > 1 ? (uint16_t) x[1] << 8 : 0);
                if (id(io_do) & 0x01) id(led_out).turn_on();
                else id(led_out).turn_off();
              }

interval:
  - interval: 100ms
    then:
      - canbus.send: # body controller
          can_id: 0x3C0
          data: !lambda |-
            id(body_counter) += 1;
            bool open = id(door) || id(boot_button).state;
            return {(uint8_t) ((open ? 0x04 : 0x00) | (id(light) ? 0x20 : 0x00)), id(body_counter), 0xD7, 0x00,
                    (uint8_t) (id(light) ? 80 : 0), 0x00, 0x00, 0x00};
  - interval: 1s
    then:
      - canbus.send: # battery voltage, 48.65-48.67 V
          can_id: 0x356
          data: !lambda |-
            uint16_t volt = 4865 + (millis() / 1000) % 3;
            return {(uint8_t) (volt & 0xFF), (uint8_t) (volt >> 8), 0x00, 0x00, 0x4A, 0x01};
      - canbus.send: # CANopen heartbeat of node 7
          can_id: 0x707
          data: !lambda "return {(uint8_t) (id(io_operational) ? 0x05 : 0x7F)};"
  - interval: 500ms
    then:
      - if:
          condition:
            lambda: return id(io_operational);
          then:
            - canbus.send: # TPDO1: DI0 = BOOT button, DI8-15 = DO0-7
                can_id: 0x187
                data: !lambda "return {(uint8_t) (id(boot_button).state ? 0x01 : 0x00), (uint8_t) (id(io_do) & 0xFF)};"
